<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Note detail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
<div class="scroll" style="padding-bottom:110px">
<div class="topbar">
<div class="appbar">
<a class="iconbtn" href="Notes.dc.html" aria-label="Back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
<span class="grow"></span>
<a class="iconbtn" href="EditNote.dc.html" aria-label="Edit note"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg></a>
<a class="iconbtn" href="Notes.dc.html" aria-label="Delete note"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg></a>
</div>
</div>

<a class="note-title rise" style="--i:0;padding:8px 24px 0" href="MovieDetail.dc.html">
<div class="poster g2" style="width:56px"><span></span></div>
<div><div class="title-md">Arrival</div><div class="sub2">Movie · Watching 2</div></div>
</a>
<div class="note-top rise" style="--i:1;padding:16px 24px 0">
<span class="badge b-type">Scene</span>
<span class="ts"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>0:24:10</span>
</div>
<p class="big-text rise" style="--i:2">The first time the heptapod ink ring appears. The whole theater held its breath.</p>
<p class="sub2 rise" style="--i:3;margin:12px 24px 0">12 Oct 2026, 9:41 PM</p>

<div class="section"><h2>Comments</h2><span class="sub2">{{ countLabel }}</span></div>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><p class="sub2" style="margin:0 24px">No comments yet. Add one below.</p></sc-if>
<sc-for list="{{ comments }}" as="c" hint-placeholder-count="2">
<div class="comment">
<div class="body"><p>{{ c.text }}</p><span class="sub2">{{ c.when }}</span></div>
<button class="iconbtn" aria-label="Delete comment" onClick="{{ c.remove }}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg></button>
</div>
</sc-for>
</div>

<div class="composer">
<input class="tf" aria-label="Add a comment" placeholder="Add a comment" value="{{ draft }}" onInput="{{ onDraft }}">
<button class="send" aria-label="Send comment" onClick="{{ send }}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 11l7 2 2 8zM10 13L21 3"/></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = {
draft: '',
comments: [
{ id: 1, text: 'Rewatched this scene last night. Still gives me chills.', when: 'Yesterday, 11:02 PM' },
{ id: 2, text: 'Compare with the opening shot of the Louise flashbacks.', when: '20 Oct 2026' }
]
};
renderVals() {
const { comments, draft } = this.state;
return {
draft,
isEmpty: comments.length === 0,
countLabel: comments.length === 1 ? '1 comment' : comments.length + ' comments',
onDraft: (e) => this.setState({ draft: e.target.value }),
send: () => {
const text = draft.trim();
if (!text) return;
this.setState({ comments: comments.concat({ id: Date.now(), text, when: 'Just now' }), draft: '' });
},
comments: comments.map((c) => ({
text: c.text,
when: c.when,
remove: () => this.setState({ comments: comments.filter((x) => x.id !== c.id) })
}))
};
}
}
</script>
</body>
</html>
