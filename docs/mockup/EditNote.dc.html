<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit note</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="m3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
<div class="topbar" style="padding-bottom:4px">
<div class="appbar">
<a class="iconbtn" href="NoteDetail.dc.html" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<span class="grow title-md" style="font-size:20px">Edit note</span>
<a class="btn-fill" href="NoteDetail.dc.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Save</a>
</div>
</div>
<div class="scroll" style="padding-bottom:24px">
<div class="form">
<div class="bigcover rise" style="--i:0">
<div class="poster g2"><span>Arrival</span></div>
<div class="title-md" style="margin-top:8px">Arrival</div>
<div class="sub2">Movie</div>
</div>

<div>
<label class="lbl" for="watching">Watching</label>
<input class="tf" id="watching" value="Watching 2">
</div>

<div>
<span class="lbl">Note type</span>
<div class="chips" style="padding:0;flex-wrap:wrap">
<sc-for list="{{ types }}" as="t" hint-placeholder-count="4">
<button class="{{ t.cls }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">{{ t.label }}</button>
</sc-for>
</div>
</div>

<div>
<label class="lbl" for="ts">Timestamp (optional)</label>
<div style="display:flex;gap:8px;align-items:center">
<input class="tf" id="ts" value="0:24:10" style="flex:1">
<button class="btn-tonal" style="height:56px;border-radius:14px">Clear</button>
</div>
</div>

<div>
<label class="lbl" for="body">Note</label>
<textarea class="tf" id="body" rows="5" value="The first time the heptapod ink ring appears. The whole theater held its breath."></textarea>
</div>

<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-tonal"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>Add image</button>
<button class="btn-tonal"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>12 Oct 2026, 9:41 PM</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { type: 'Scene' };
renderVals() {
const cur = this.state.type;
return {
types: ['Scene', 'Summary', 'Thought', 'Question'].map((label) => ({
label,
cls: label === cur ? 'chip on' : 'chip',
pressed: label === cur ? 'true' : 'false',
pick: () => this.setState({ type: label })
}))
};
}
}
</script>
</body>
</html>
