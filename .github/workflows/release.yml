name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Add TMDB key
        run: echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > local.properties
      # Keeps the APK signature stable across releases so users can update in place.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set: this APK gets a random signature and cannot update earlier releases."
          fi
      - name: Run unit tests
        run: ./gradlew :shared:compileCommonMainKotlinMetadata :shared:testAndroidHostTest
      - name: Build optimized APK
        run: ./gradlew :androidApp:assembleOptimized
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp androidApp/build/outputs/apk/optimized/androidApp-optimized.apk "Filmory-$TAG.apk"
          sha256sum "Filmory-$TAG.apk" > "Filmory-$TAG.apk.sha256"
          gh release upload "$TAG" "Filmory-$TAG.apk" "Filmory-$TAG.apk.sha256"
